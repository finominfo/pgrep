name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and test
        shell: bash
        run: ./gradlew clean build --no-daemon
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify Java 8 runtime and documented example
        shell: bash
        run: |
          java -jar build/libs/pgrep-2.0.0.jar --input examples/input --patterns examples/ids.txt --config examples/pgrep.properties --output build/example.tsv
          diff -u examples/expected.tsv build/example.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-java-${{ matrix.java }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
